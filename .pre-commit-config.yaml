# ============================================================================
# pre-commit 钩子配置
#
# 定位：把"格式与低级错误"拦在提交阶段，而不是等 CI 报红再回头修。
# 设计取舍：本地钩子只做**快**检查（毫秒级），重活儿（跑测试、装依赖）交给 CI。
# 如果钩子慢到让人想加 --no-verify，那它就已经失效了。
#
# 使用：
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files        # 手动全量跑一遍
# ============================================================================

# 最低 pre-commit 版本：v4 起支持 `stages` 与新的 hook 定义方式
minimum_pre_commit_version: "3.5.0"

# 用项目自己的 ruff.toml，保证钩子与 CI 的判定标准完全一致
# （两处配置不一致是"本地过了 CI 挂"的最常见原因）
default_language_version:
  python: python3.10

repos:
  # --------------------------------------------------------------------------
  # 1. 通用文件卫生：与语言无关，成本极低但收益立竿见影
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # 删除行尾空白：否则每次改动都会在 diff 里留下大量无意义变更
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]  # Markdown 里行尾两个空格是硬换行，需保留
      # 文件末尾补一个换行：POSIX 约定，也避免 diff 出现 "\ No newline at end of file"
      - id: end-of-file-fixer
      # 校验 YAML 语法：CI 配置写错时，本地就能发现，不用等 push 后看 Actions 报错
      - id: check-yaml
        args: [--allow-multiple-documents]
      # 防止把 `<<<<<<< HEAD` 这类冲突标记提交进去
      - id: check-merge-conflict
      # 阻止大文件进版本库：--maxkb=2048 即 2 MB
      # 背景：本项目 papers/ 下有 6 篇 PDF（最大 13 MB）、local_models/ 下有
      # 1.3 GB 嵌入模型。这些都不该进 Git —— 前者应放网盘/附录，后者按需下载。
      # 限值设 2 MB 而不是默认 500 KB，是因为截图（README 配图）常超过 500 KB，
      # 一律拦下会逼人用 --no-verify，反而让这道闸门失效。
      - id: check-added-large-files
        args: [--maxkb=2048]
      # 阻止私钥进入版本库：.env 里的 API Key 是同类风险，故一并管理（见 .gitignore）
      - id: detect-private-key
      # 校验 JSON 语法（eval/questions.jsonl 是 JSONL，不适用于本钩子，
      # 因此不做全仓 JSON 检查，只检查标准 .json 文件）
      - id: check-json
        exclude: \.jsonl$
      # 阻止直接提交到主干的常见误操作：分支名写错时给出提醒
      - id: check-ast
      # 统一文件换行符为 LF，避免 Windows/Linux 协作时出现整文件 diff
      - id: mixed-line-ending
        args: [--fix=lf]

  # --------------------------------------------------------------------------
  # 2. ruff：lint（含自动修复）+ 格式化
  #    rev 与 requirements-dev.txt 中的 ruff==0.7.4 保持一致，
  #    否则本地钩子与 CI 会因为规则集差异给出不同结论
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      # --fix 自动修掉可修问题；--exit-non-zero-on-fix 让"自动修复过"也算失败，
      # 强制重新 git add 并再提交一次，避免"改了但没提交"导致 CI 仍然报红。
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # 格式化：与 black 兼容但更快，配置在 ruff.toml 的 [format] 段
      - id: ruff-format
